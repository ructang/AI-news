theme: jekyll-theme-cayman
title: AI News Daily
description: AI-curated daily digest of AI business, companies, and application markets
baseurl: "/AI-news" # the subpath of your site, e.g. /blog
url: "https://ructang.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
